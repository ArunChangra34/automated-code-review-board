[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-board"
version = "0.1.0"
description = "Automated Code Review Board with multi-agent orchestration and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "semantic-kernel>=1.15.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "unidiff>=0.7.5",
    "scikit-learn>=1.4.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "starlette>=0.30.0",
]

[tool.setuptools]
packages = ["agents", "api", "cli", "config", "core", "knowledge_base", "plugins", "reporting", "ui"]
py-modules = ["app", "main"]

[tool.setuptools.package-data]
"*" = ["*.diff", "*.yaml", "*.json", "*.html"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*Suite", "*Tests"]
