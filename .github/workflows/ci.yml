name: Automated Code Review Board CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  review-board-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code formatting check (black)
        run: |
          black --check core agents plugins cli reporting tests config

      - name: Run linter (ruff)
        run: |
          ruff check core agents plugins cli reporting tests config

      - name: Run type checking (mypy)
        run: |
          mypy core agents plugins reporting cli

      - name: Execute test suite with coverage
        run: |
          pytest --cov=core --cov=agents --cov-fail-under=85 --cov-report=term-missing tests/

      - name: Run offline demo on all 5 sample diffs
        run: |
          python -m cli.main demo --output-dir output/ci_demo

      - name: Upload review output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-artifacts-py${{ matrix.python-version }}
          path: output/
          if-no-files-found: warn
